<mat-card appearance="outlined" *ngIf="!selectedFaction()">
  <mat-card-header>
    <mat-card-title>Choose faction</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-chip-listbox class="mat-mdc-chip-set-stacked">
      <mat-chip-option *ngFor="let faction of factions()" (click)="factionClick_hdl(faction)">
        <mat-chip-avatar>
          <mat-icon svgIcon="{{faction.name.toLowerCase()}}" inline="true"></mat-icon>
        </mat-chip-avatar>
        <span>{{faction.name}}</span>
      </mat-chip-option>
    </mat-chip-listbox>
  </mat-card-content>
</mat-card>
<app-tech-picker [faction]="selectedFaction()" [tech]="tech()" *ngIf="selectedFaction()"></app-tech-picker>
